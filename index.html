<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artecon | Propostas de Honorários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Identidade Artecon (manual da marca): cinza #4F4C4D, vermelho #BC151B, ciano #00AEEF, amarelo #FFF200, fundo #FBFEFE */
:root{
  --cinza:#4F4C4D; --vermelho:#BC151B; --ciano:#00AEEF; --amarelo:#FFF200; --fundo:#FBFEFE;
  --tinta:#2f2d2e; --suave:#6f6b6c; --linha:#dfe7eb; --branco:#fff; --verde:#147343;
  --titulo:'Playfair Display',Georgia,'Times New Roman',serif;
  --texto:'DM Sans','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--tinta);font:14px/1.45 var(--texto)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- estrutura ---------- */
.app{display:flex;min-height:100vh}
.lateral{width:236px;flex:none;background:var(--branco);border-right:8px solid var(--amarelo);padding:26px 18px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.lateral img{width:100%;max-width:180px;display:block;margin:0 auto 6px}
.lateral .nome-app{text-align:center;font-size:12px;color:var(--suave);margin-bottom:22px}
.menu{display:flex;flex-direction:column}
.menu button{background:none;border:0;border-bottom:1px solid var(--linha);border-left:4px solid transparent;text-align:left;padding:12px 10px;cursor:pointer;color:var(--cinza)}
.menu button:hover{background:#f3f8fa}
.menu button.ativo{border-left-color:var(--ciano);color:var(--vermelho);font-weight:700}
.rodape-lateral{margin-top:auto;font-size:12px;color:var(--suave);display:flex;flex-direction:column;gap:8px}
.portal-link{color:var(--cinza);text-decoration:none;font-weight:700;padding:6px 0;border-bottom:1px solid var(--linha)}.portal-link:hover{color:var(--vermelho)}
.versao{display:inline-block;background:var(--cinza);color:#fff;padding:3px 9px;font-weight:700;font-size:12px;cursor:pointer;border:0}
.modo{padding:6px 8px;border-left:4px solid var(--amarelo);background:#fffde0;color:#5c5600}
.modo.nuvem{border-left-color:var(--verde);background:#e9f7ef;color:var(--verde)}
.principal{flex:1;min-width:0;padding:34px 44px 60px}
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.topo h1{font:500 34px/1.1 var(--titulo);margin:0;color:var(--cinza)}
.topo p{margin:6px 0 0;color:var(--suave)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- componentes ---------- */
.btn{border:1px solid var(--linha);background:var(--branco);padding:10px 16px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--cinza)}
.btn.primario{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn.primario:hover{background:#a01217}
.btn.mini{padding:5px 9px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.painel{background:var(--branco);border:1px solid var(--linha);padding:20px;margin-bottom:20px}
.painel h2{font:700 17px var(--titulo);margin:0 0 14px;color:var(--vermelho)}
.indicadores{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:26px}
.ind{background:var(--branco);border:1px solid var(--linha);border-top:6px solid var(--ciano);padding:16px 18px;margin-left:-1px}
.ind:first-child{margin-left:0}
.ind:nth-child(2){border-top-color:var(--vermelho)}
.ind:nth-child(3){border-top-color:var(--amarelo)}
.ind:nth-child(4){border-top-color:var(--cinza)}
.ind .rot{color:var(--suave);font-size:12.5px}
.ind .val{font:500 30px/1.15 var(--titulo);color:var(--cinza);margin:6px 0 4px}
.ind .sub{font-size:12.5px;color:var(--suave)}
.duas{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.rolagem{overflow-x:auto}
table.lista{width:100%;border-collapse:collapse}
.lista th,.lista td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--linha);vertical-align:middle}
.lista th{font-size:12px;color:var(--suave);font-weight:500;white-space:nowrap}
.lista td.num,.lista th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lista small{color:var(--suave)}
.lista .acoes-linha{white-space:nowrap;text-align:right}
.selo{display:inline-block;padding:3px 9px;font-size:12px;font-weight:700;border-left:4px solid var(--cinza);background:#eef1f3;color:var(--cinza)}
.selo.enviada{border-color:var(--ciano);background:#e4f5fd;color:#056a90}
.selo.negociacao{border-color:#d8cd00;background:#fffbc2;color:#5c5600}
.selo.aprovada{border-color:var(--verde);background:#e4f7ed;color:var(--verde)}
.selo.perdida{border-color:var(--vermelho);background:#fde8e8;color:#8e1015}
.vencida{color:var(--vermelho);font-weight:700}
.vazio{text-align:center;color:var(--suave);padding:34px 10px}
.funil-linha{display:flex;justify-content:space-between;margin:12px 0 5px}
.barra{height:8px;background:#edf1f3}
.barra i{display:block;height:100%;background:var(--ciano)}
.aviso{border-left:4px solid var(--vermelho);background:#fdf1f1;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.aviso.ambar{border-left-color:#d8cd00;background:#fffde0}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filtros input{flex:1;min-width:220px}

/* ---------- formulário ---------- */
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.campo{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.campo.c1{grid-column:span 1}.campo.c4{grid-column:1/-1}
.campo label,.rotulo{font-weight:700;font-size:12.5px;color:var(--cinza)}
.campo .dica{font-size:12px;color:var(--suave)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{border:1px solid #cfd9de;background:#fff;padding:9px 10px;width:100%;border-radius:0}
textarea{resize:vertical}
.marcar{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.marcar input{margin-top:3px}
.itens{border:1px solid var(--linha)}
.item{display:grid;grid-template-columns:1.1fr 1.5fr 200px 64px 116px 106px 34px;gap:8px;padding:10px;border-bottom:1px solid var(--linha);align-items:start}
.item.cab{background:#f5f9fa;font-size:12px;color:var(--suave);padding:7px 10px}
.item .subtotal{text-align:right;padding-top:9px;font-variant-numeric:tabular-nums}
.item .x{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--vermelho);padding:6px}
.parcela{display:grid;grid-template-columns:140px 1fr 34px;gap:8px;margin-bottom:6px}
.totais{display:flex;justify-content:flex-end;gap:34px;padding:14px 10px;font-size:15px}
.totais b{font:700 20px var(--titulo);color:var(--vermelho);margin-left:8px}
.erros{border-left:4px solid var(--vermelho);background:#fdf1f1;padding:12px 16px;margin-bottom:16px}
.erros ul{margin:6px 0 0;padding-left:18px}
.barra-salvar{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.linha-tempo{list-style:none;margin:0;padding:0}
.linha-tempo li{padding:8px 0 8px 14px;border-left:3px solid var(--linha);font-size:13px}
.linha-tempo li b{color:var(--cinza)}
dialog{border:1px solid var(--linha);border-top:6px solid var(--ciano);padding:24px;width:min(560px,94vw)}
dialog::backdrop{background:rgba(47,45,46,.45)}
dialog h2{font:700 20px var(--titulo);margin:0 0 16px;color:var(--cinza)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--cinza);color:#fff;padding:12px 16px;border-left:5px solid var(--amarelo);max-width:420px;z-index:50}
.toast.erro{background:#8e1015;border-left-color:#fff}
.versoes h3{font:700 18px var(--titulo);margin:0 0 4px;color:var(--cinza)}
.versoes ul{margin:6px 0 22px;padding-left:20px}
.versoes li{margin:4px 0}

/* ---------- controle, histórico, link e página do cliente (v1.3.0) ---------- */
.etapas{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--linha)}
.etapas div{padding:9px 16px;border-right:1px solid var(--linha);flex:1;min-width:150px}
.etapas div:last-child{border-right:0}
.etapas span{display:block;font-size:12px;color:var(--suave)}
.etapas b{font-variant-numeric:tabular-nums;color:var(--cinza)}
.linha-tempo li{border-left-color:var(--linha)}
.linha-tempo .lt-quando{display:inline-block;min-width:150px;font-variant-numeric:tabular-nums;color:var(--cinza);font-weight:700}
.linha-tempo small{color:var(--suave)}
.linha-tempo .lt-assinada{border-left-color:var(--verde)}
.linha-tempo .lt-alteracao{border-left-color:var(--amarelo)}
.linha-tempo .lt-cliente_abriu,.linha-tempo .lt-link_gerado{border-left-color:var(--ciano)}
.linha-tempo .dif{margin:4px 0 0 150px;padding-left:16px;color:var(--suave);font-size:12.5px}
.linha-tempo .dif li{border:0;padding:1px 0;font-size:12.5px}
.linkbox{border:1px solid var(--ciano);background:#f0fafe;padding:12px 14px}
.cliente{min-height:100vh;background:#e9eef0}
.cli-topo{position:sticky;top:0;z-index:5;background:#fff;border-bottom:6px solid var(--amarelo);display:flex;align-items:center;gap:18px;padding:10px 22px;flex-wrap:wrap}
.cli-topo img{height:46px}
.cli-id{flex:1;min-width:180px}.cli-id b{display:block;font:700 18px var(--titulo);color:var(--cinza)}.cli-id span{color:var(--suave)}
.cli-topo .btn{text-decoration:none;display:inline-block}
.cli-aceite{max-width:210mm;margin:0 auto 40px;background:#fff;border:1px solid var(--linha);border-top:6px solid var(--verde);padding:24px 28px}
.cli-aceite h2{font:700 22px var(--titulo);margin:0 0 10px;color:var(--cinza)}
.comprovante{break-before:page;page-break-before:always;padding-top:2mm}
.comprovante table{width:100%;border-collapse:collapse;margin:0 0 5mm}
.comprovante .ass-bloco{break-inside:avoid;margin-bottom:5mm}
.comprovante h4{font:700 10.5pt Arial,sans-serif;margin:0 0 2mm;padding:1.5mm 2.5mm;background:#4F4C4D;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.comprovante .ass-foto{max-width:80mm;max-height:70mm;display:block;border:.2mm solid #999}
.foto-box{border:1px solid var(--linha);border-left:4px solid var(--ciano);padding:12px 14px;margin-top:14px}
.foto-box p{margin:4px 0 10px}
.foto-box img{max-width:260px;max-height:220px;margin-top:10px;border:1px solid var(--linha);display:block}
.privacidade{margin-top:14px;border:1px solid var(--linha);padding:10px 14px;font-size:13px;color:var(--suave)}
.privacidade summary{cursor:pointer;font-weight:700;color:var(--cinza)}
.privacidade p{margin:8px 0 0}
table.miolo .comprovante th,table.miolo .comprovante td{border:.2mm solid #999;padding:1.6mm 2.5mm;text-align:left;vertical-align:top;font-size:10pt}
table.miolo .comprovante th{width:48mm;background:#f2f4f5;font-weight:700}
.comprovante .hash{font-family:Consolas,'Courier New',monospace;font-size:8.5pt;word-break:break-all}
.comprovante p{font-size:10pt}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .cx{background:#fff;border:1px solid var(--linha);border-top:8px solid var(--amarelo);padding:34px;width:min(400px,100%)}
.login img{width:200px;display:block;margin:0 auto 18px}
.login .campo{margin-bottom:12px}

/* ---------- documento (A4) ---------- */
.doc-area{background:#e9eef0;padding:24px;overflow-x:auto}
.folha{width:210mm;background:#fff;margin:0 auto 22px;box-shadow:0 2px 14px rgba(47,45,46,.18);color:#000;font:12pt/1.15 Arial,'Liberation Sans',Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* capa = arte do modelo oficial (imagem) + textos nas posições medidas no .docx */
.doc-area .folha{zoom:var(--zf,1)}
.capa{height:297mm;position:relative;overflow:hidden;break-after:page;page-break-after:always;z-index:3;background:#fff}
.capa>img{position:absolute;inset:0;width:210mm;height:297mm;display:block}
.capa div{position:absolute;white-space:nowrap}
.capa .t1{left:6.6mm;top:98mm;font:700 57pt/1.15 Arial,'Liberation Sans',sans-serif;color:#fff}
.capa .t2{left:6.6mm;top:121.2mm;width:93mm;white-space:normal;font:25.5pt/12.7mm Arial,'Liberation Sans',sans-serif;color:#fff}
.capa .t3{left:12.1mm;top:218mm;font-size:15.5pt}
.capa .t4{left:11.5mm;top:226mm;font-weight:700;font-size:21pt}
.capa .t5{left:11.5mm;top:236mm;width:90mm;white-space:normal;font-weight:700;font-size:12.5pt;line-height:6.1mm}
.capa .t6{top:286.4mm;font-weight:700;font-size:15pt;color:#fff}
table.miolo{width:100%;border-collapse:collapse}
table.miolo td{padding:0}
.cab-doc{height:36mm;position:relative}
.cab-doc img{position:absolute;left:0;top:0;width:210mm;height:34mm;display:block}
.cab-doc div{position:absolute;left:97mm;width:100mm;top:7.6mm;text-align:center;font-weight:700;font-size:12pt;line-height:1.15}
.cab-doc div span{display:block;font-size:14.5pt}
.corpo-doc{padding:0 15mm 0 30mm}
.corpo-doc p{margin:0 0 4.9mm;text-align:justify}
.corpo-doc h3{font:700 12pt/1.15 Arial,'Liberation Sans',sans-serif;margin:0 0 4.9mm;break-after:avoid}
.corpo-doc ul{margin:-4.9mm 0 4.9mm;padding-left:12.5mm;text-align:justify}
.corpo-doc .alinea{margin:-2mm 0 4.9mm}
.corpo-doc .ident{display:flex;justify-content:space-between;gap:10mm}
.assinatura{margin:10mm auto 0;text-align:center;break-inside:avoid}
.aceite{margin-top:12mm;border:.3mm solid #000;padding:5mm 6mm;break-inside:avoid}
.aceite .linhas{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:14mm}
.aceite .linhas div{border-top:.3mm solid #000;padding-top:1.5mm;font-size:10pt;text-align:center}
.pe-doc{height:33mm;position:relative}
.pe-doc img{position:absolute;left:0;bottom:0;width:210mm;height:39mm;display:block}

@media (max-width:1000px){
  .lateral{width:64px;padding:14px 6px;border-right-width:5px}
  .lateral img,.lateral .nome-app,.menu button span,.rodape-lateral .modo,.portal-link span{display:none}
  .menu button{text-align:center;padding:12px 4px}
  .principal{padding:22px 16px 50px}
  .indicadores{grid-template-columns:repeat(2,1fr)}.ind{margin:-1px 0 0 -1px}
  .duas{grid-template-columns:1fr}
  .linha-tempo .lt-quando{display:block}.linha-tempo .dif{margin-left:0}
  .grade{grid-template-columns:1fr 1fr}.campo,.campo.c1{grid-column:span 2}
  .item{grid-template-columns:1fr 1fr}.item.cab{display:none}
}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .lateral,.topo,.painel,.toast,.nao-imprime{display:none!important}
  .cliente{background:#fff}
  .principal{padding:0}
  .doc-area{background:#fff;padding:0;overflow:visible}
  .folha{box-shadow:none;margin:0}
  .doc-area .folha{zoom:1}
  .pe-doc img{position:fixed;left:0;bottom:0;z-index:1}
}
</style>
</head>

const STATUS = { rascunho:'Rascunho', enviada:'Enviada', negociacao:'Em negociação', aprovada:'Aprovada', perdida:'Perdida' };
const STATUS_ORDEM = ['rascunho','enviada','negociacao','aprovada','perdida'];
const TIPOS = { mensal:'Mensal', por_funcionario:'Mensal por funcionário', pontual:'Pontual' };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function r2(n){ return Math.round((+n || 0) * 100) / 100; }
function brl(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v || 0); }
function num2(v){ return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+v || 0); }

/* aceita "1.500,50", "1500,5", "1500.50", "R$ 1.500" */
function parseValor(txt){
  let s = String(txt ?? '').replace(/[^\d.,-]/g,'');
  if(!s) return 0;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');   // 1.500 = mil e quinhentos
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? r2(n) : 0;
}

function hojeISO(){ const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function somaDias(iso, dias){ const [y,m,d] = iso.split('-').map(Number); const dt = new Date(Date.UTC(y,m-1,d+dias)); return dt.toISOString().slice(0,10); }
function dataBR(iso){ if(!iso) return ''; const [y,m,d] = String(iso).slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function dataExtenso(iso){ if(!iso) return ''; const [y,m,d] = String(iso).slice(0,10).split('-'); return `${d} de ${MESES[+m-1]} de ${y}`; }

/* ----- CPF / CNPJ (inclusive CNPJ alfanumérico) ----- */
function soDoc(v){ return String(v ?? '').toUpperCase().replace(/[^0-9A-Z]/g,''); }
function cpfValido(c){
  if(!/^\d{11}$/.test(c) || /^(\d)\1{10}$/.test(c)) return false;
  const dv = n => { let s = 0; for(let i=0;i<n;i++) s += +c[i]*(n+1-i); const r = (s*10)%11; return r===10?0:r; };
  return dv(9)===+c[9] && dv(10)===+c[10];
}
function cnpjValido(c){
  if(!/^[0-9A-Z]{12}\d{2}$/.test(c) || /^(\d)\1{13}$/.test(c)) return false;
  const val = ch => ch.charCodeAt(0) - 48;                 // '0'..'9' = 0..9, 'A' = 17 ...
  const dv = n => { let s = 0, p = 2; for(let i=n-1;i>=0;i--){ s += val(c[i])*p; p = p===9?2:p+1; } const r = s%11; return r<2?0:11-r; };
  return dv(12)===+c[12] && dv(13)===+c[13];
}
function docValido(v){ const c = soDoc(v); if(!c) return true; return c.length===11 ? cpfValido(c) : c.length===14 ? cnpjValido(c) : false; }
function docFmt(v){
  const c = soDoc(v);
  if(c.length===11) return c.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');
  if(c.length===14) return c.replace(/^(.{2})(.{3})(.{3})(.{4})(.{2})$/,'$1.$2.$3/$4-$5');
  return c;
}

/* ----- número por extenso ----- */
const _U = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const _D = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const _C = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function _ate999(n){
  if(n===0) return ''; if(n===100) return 'cem';
  const p = []; const c = Math.floor(n/100), r = n%100;
  if(c) p.push(_C[c]);
  if(r){ if(r<20) p.push(_U[r]); else { const d = Math.floor(r/10), u = r%10; p.push(_D[d] + (u ? ' e ' + _U[u] : '')); } }
  return p.join(' e ');
}
function inteiroExtenso(n){
  n = Math.floor(Math.abs(n)); if(n===0) return 'zero';
  const grupos = []; while(n>0){ grupos.push(n%1000); n = Math.floor(n/1000); }
  const nomes = [['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];
  const partes = [];
  for(let i=grupos.length-1;i>=0;i--){
    const g = grupos[i]; if(!g) continue;
    let t = _ate999(g);
    if(i===1) t = g===1 ? 'mil' : t + ' mil';
    else if(i>1) t = t + ' ' + nomes[i][g===1?0:1];
    partes.push({t, g, i});
  }
  let out = '';
  partes.forEach((p,k) => {
    if(k===0){ out = p.t; return; }
    const ultimo = k===partes.length-1;
    out += (ultimo && (p.g<100 || p.g%100===0) ? ' e ' : ', ') + p.t;
  });
  return out.replace(/\s+/g,' ').trim();
}
function valorExtenso(v){
  v = r2(v); const int = Math.floor(v), cent = Math.round((v-int)*100);
  const p = [];
  if(int>0){
    let t = inteiroExtenso(int);
    const redondo = int>=1000000 && int%1000000===0;
    p.push(t + (redondo?' de':'') + (int===1?' real':' reais'));
  }
  if(cent>0) p.push(inteiroExtenso(cent) + (cent===1?' centavo':' centavos'));
  return p.length ? p.join(' e ') : 'zero real';
}

/* ----- totais ----- */
function totais(itens){
  let mensal = 0, pontual = 0;
  (itens||[]).forEach(i => {
    const v = +i.valor || 0;
    if(i.tipo==='pontual') pontual += v;
    else if(i.tipo==='por_funcionario') mensal += v * (parseInt(i.qtd)||0);
    else mensal += v;
  });
  return { mensal:r2(mensal), pontual:r2(pontual) };
}
function totalFixoMensal(itens){ return r2((itens||[]).filter(i=>i.tipo==='mensal').reduce((a,i)=>a+(+i.valor||0),0)); }

/* ----- indicadores do painel ----- */
function indicadores(props, hoje){
  const mes = hoje.slice(0,7);
  const ativos = props.filter(p => !p.excluido_em);
  const st = s => ativos.filter(p => p.status===s);
  const aprov = st('aprovada'), perd = st('perdida');
  const abertas = ativos.filter(p => p.status==='enviada' || p.status==='negociacao');
  const decididas = aprov.length + perd.length;
  return {
    noMes: ativos.filter(p => String(p.data_proposta).slice(0,7)===mes).length,
    abertas: abertas.length,
    abertasMensal: r2(abertas.reduce((a,p)=>a+(+p.total_mensal||0),0)),
    abertasPontual: r2(abertas.reduce((a,p)=>a+(+p.total_pontual||0),0)),

    aprovPontual: r2(aprov.reduce((a,p)=>a+(+p.total_pontual||0),0)),
    vencidas: abertas.filter(p => p.validade && p.validade < hoje),
    vencendo: abertas.filter(p => p.validade && p.validade >= hoje && p.validade <= somaDias(hoje,3)),
    funil: STATUS_ORDEM.map(s => [s, st(s).length]),
    total: ativos.length
  };
}

function numeroFmt(p){ return p.numero ? String(p.numero).padStart(3,'0') + '/' + p.ano : 'rascunho'; }

    if(t.pontual>0) v.push({ texto:`Os serviços pontuais descritos no item 1.1 totalizam ${money(t.pontual)}` + (c.parcelas && c.parcelas.length ? ', a serem pagos da seguinte forma:' : ', a serem pagos na aceitação da proposta.'), alineas: parcelasTxt(c.parcelas, money) });

function parcelasTxt(parcelas, money){
  return (parcelas||[]).filter(x => (+x.valor||0)>0).map((x,i) => `${String.fromCharCode(97+i)}) ${money(x.valor)}, ${x.descricao || 'conforme combinado'}`);
}
function somaParcelas(parcelas){ return r2((parcelas||[]).reduce((a,x)=>a+(+x.valor||0),0)); }

/* validação antes de salvar — devolve lista de mensagens */
function validarProposta(p){
  const er = [];
  if(!String(p.cliente_nome||'').trim()) er.push('Informe o cliente.');
  if(!docValido(p.cliente_documento)) er.push('CNPJ/CPF inválido. Confira os dígitos ou deixe em branco.');
  const it = (p.itens||[]);
  if(!it.length) er.push('Inclua pelo menos um serviço.');
  it.forEach((i,k) => { if(!String(i.nome||'').trim()) er.push(`Serviço ${k+1} está sem nome.`); });
  const t = totais(it);
  if(it.length && t.mensal + t.pontual + it.filter(i=>i.tipo==='por_funcionario').reduce((a,i)=>a+(+i.valor||0),0) <= 0) er.push('A proposta está com valor zero.');
  if(p.modelo==='pontual' && t.pontual<=0 && it.length) er.push('Proposta pontual precisa de pelo menos um serviço do tipo Pontual com valor.');
  const par = (p.condicoes||{}).parcelas||[];
  if(par.length && t.pontual>0 && Math.abs(somaParcelas(par) - t.pontual) > 0.009) er.push(`As parcelas somam ${brl(somaParcelas(par))}, mas o total pontual é ${brl(t.pontual)}.`);
  if(p.validade && p.data_proposta && p.validade < p.data_proposta) er.push('A validade está anterior à data da proposta.');
  return er;
}

/* ----- controle: data/hora e descrição legível das alterações ----- */
function dataHora(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const f = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return `${f.day}/${f.month}/${f.year} às ${f.hour}:${f.minute}`;
}
const ROTULO_CAMPO = { cliente_nome:'Cliente', cliente_documento:'CNPJ/CPF', contato:'Responsável', tratamento:'Tratamento', modelo:'Modelo', assunto:'Assunto', abertura:'Parágrafo de abertura', itens:'Serviços', condicoes:'Condições', total_mensal:'Total mensal', total_pontual:'Total pontual', validade:'Validade', observacoes:'Anotações internas', excluido_em:'Exclusão' };
const ROTULO_COND = { dia_vencimento:'Dia de vencimento', indice:'Índice de reajuste', adicional_anual:'Adicional anual', revisao_bimestral:'Revisão bimestral', taxas_abertura:'Cláusula das taxas de abertura', prolabore_sem_custo:'Pró-labore sem custo', parcelas:'Parcelas', prazo_dias:'Prazo de execução (dias)', prazo_marco:'Contagem do prazo', adicionais:'Cláusulas adicionais', aceite:'Termo de aceite' };
function _curto(v){ const t = String(v ?? '').replace(/\s+/g,' ').trim(); return t ? (t.length>70 ? '“' + t.slice(0,70) + '…”' : '“' + t + '”') : '(vazio)'; }
function _simNao(v){ return v===true ? 'sim' : v===false ? 'não' : (v===null || v===undefined || v==='' ? '(vazio)' : String(v)); }
function _itemTxt(i){ return `“${i.nome}” ${brl(i.valor)}${i.tipo==='por_funcionario' ? ' por funcionário' + ((parseInt(i.qtd)||0) ? ' × ' + parseInt(i.qtd) : '') : i.tipo==='pontual' ? ' (pontual)' : '/mês'}`; }
function descreveAlteracao(det){
  const a = det.antes || {}, d = det.depois || {}, out = [];
  (det.campos || []).forEach(k => {
    const x = a[k], y = d[k];
    if(k==='total_mensal' || k==='total_pontual') out.push(`${ROTULO_CAMPO[k]}: ${brl(x)} → ${brl(y)}`);
    else if(k==='validade') out.push(`Validade: ${x ? dataBR(x) : '(sem data)'} → ${y ? dataBR(y) : '(sem data)'}`);
    else if(k==='cliente_documento') out.push(`CNPJ/CPF: ${docFmt(x) || '(vazio)'} → ${docFmt(y) || '(vazio)'}`);
    else if(k==='modelo') out.push(`Modelo: ${x==='pontual'?'pontual':'mensal'} → ${y==='pontual'?'pontual':'mensal'}`);
    else if(k==='excluido_em') out.push(y ? 'Proposta excluída' : 'Proposta restaurada');
    else if(k==='itens'){
      const A = Array.isArray(x) ? x : [], B = Array.isArray(y) ? y : [], usados = new Set();
      B.forEach(n => { const i = A.findIndex((o,ix) => !usados.has(ix) && o.nome===n.nome);
        if(i<0) out.push('Serviço incluído: ' + _itemTxt(n));
        else { usados.add(i); const o = A[i]; if(JSON.stringify([o.tipo,+o.valor||0,parseInt(o.qtd)||0,o.descricao||'']) !== JSON.stringify([n.tipo,+n.valor||0,parseInt(n.qtd)||0,n.descricao||''])) out.push(`Serviço alterado: ${_itemTxt(o)} → ${_itemTxt(n)}` + ((o.descricao||'')!==(n.descricao||'') ? ' (descrição alterada)' : '')); } });
      A.forEach((o,ix) => { if(!usados.has(ix)) out.push('Serviço removido: ' + _itemTxt(o)); });
    }
    else if(k==='condicoes'){
      const A = x || {}, B = y || {};
      [...new Set([...Object.keys(A), ...Object.keys(B)])].forEach(c => {
        if(JSON.stringify(A[c] ?? null) === JSON.stringify(B[c] ?? null)) return;
        if(c==='parcelas') out.push(`Parcelas: ${(A[c]||[]).length} → ${(B[c]||[]).length} (${(B[c]||[]).map(p => brl(p.valor)).join(' + ') || 'sem parcelas'})`);
        else if(c==='adicionais' || c==='prazo_marco') out.push(`${ROTULO_COND[c] || c}: ${_curto(A[c])} → ${_curto(B[c])}`);
        else out.push(`${ROTULO_COND[c] || c}: ${_simNao(A[c])} → ${_simNao(B[c])}`);
      });
    }
    else out.push(`${ROTULO_CAMPO[k] || k}: ${_curto(x)} → ${_curto(y)}`);
  });
  return out;
}
function etapaAtual(p){
  if(p.assinada_em) return [p.escritorio_assinou_em ? 'Assinada por todos' : 'Assinada pelo cliente', p.assinada_em];
  if(p.status==='aprovada' && p.aprovada_em) return ['Aprovada', p.aprovada_em];

  if(p.escritorio_assinou_em) return ['Escritório assinou — faltam clientes', p.escritorio_assinou_em];

  return null;
}

  grava(){ try{ localStorage.setItem(LKEY, JSON.stringify(this.db)); }catch(e){ throw new Error('Não foi possível gravar no navegador: ' + e.message); } },
  async boot(){
    let bruto = null; try{ bruto = JSON.parse(localStorage.getItem(LKEY) || 'null'); }catch(e){ bruto = null; }
    this.db = bruto || this.inicial();
    if(!bruto) this.grava();
    return 'ok';
  },
  inicial(){
    const db = { tenant:{ id:'local', nome:'Artecon Artes Contábeis', escritorio:{...ESCRITORIO_PADRAO} }, clientes:[], propostas:[], historico:[], numeradores:{},
      servicos:[ ['Contábil e Fiscal','até 100 lançamentos mensais, incluindo a emissão de pró-labore.','mensal',0],
                 ['Armazenamento de Arquivos Digitais','até 1200 lançamentos por ano.','mensal',0],
                 ['Trabalhista','admissão, dispensa, elaboração de folha de pagamento, obrigações principais e acessórias.','por_funcionario',70.96],
                 ['Planejamento Tributário','análise tributária apontando o melhor regime de tributação pela legislação existente, por meio de planilha com parecer e respostas aos questionamentos levantados.','pontual',0],
                 ['Escrituração contábil de exercícios anteriores','escrituração contábil regular dos exercícios em atraso.','pontual',0],
                 ['Abertura de empresa','constituição da pessoa jurídica e inscrições nos órgãos competentes.','pontual',0]
               ].map((s,i) => ({ id:uid(), tenant_id:'local', nome:s[0], descricao:s[1], tipo:s[2], valor_padrao:s[3], ordem:(i+1)*10, excluido_em:null })) };
    // aproveita o que havia no protótipo (chave artecon_propostas_v1)
    try{
      const v1 = JSON.parse(localStorage.getItem('artecon_propostas_v1') || '[]');
      const mapa = { 'Rascunho':'rascunho','Enviada':'enviada','Em negociação':'negociacao','Aprovada':'aprovada','Perdida':'perdida' };
      v1.slice().reverse().forEach(o => {
        const [d,m,y] = String(o.created||'').split('/'); const data = y ? `${y}-${m}-${d}` : hojeISO();
        const itens = (o.items||[]).map(i => ({ nome:String(i.name||'Serviço'), descricao:'', tipo:'mensal', valor:r2(i.value), qtd:0 }));
        const ano = +data.slice(0,4); db.numeradores[ano] = (db.numeradores[ano]||0) + 1;
        db.propostas.push({ id:uid(), tenant_id:'local', numero:db.numeradores[ano], ano, cliente_id:null, cliente_nome:String(o.client||'Cliente'), cliente_documento:soDoc(o.doc)||null, contato:o.contact||'', tratamento:'', modelo:'recorrente', assunto:ASSUNTO.recorrente, abertura:ABERTURA.recorrente, itens, condicoes:{ dia_vencimento:20, indice:'IGP-M/FGV', adicional_anual:true, revisao_bimestral:true, taxas_abertura:true, adicionais:'' }, total_mensal:totais(itens).mensal, total_pontual:0, status:mapa[o.status]||'rascunho', data_proposta:data, validade:o.validity||null, observacoes:o.notes||'', criado_em:new Date().toISOString(), excluido_em:null });
      });
    }catch(e){ /* protótipo sem dados aproveitáveis */ }
    return db;
  },
  async carregar(){ const d = this.db; S.tenant = d.tenant; S.perfil = 'diretor'; S.email = 'modo local'; S.clientes = d.clientes; S.servicos = d.servicos; S.propostas = d.propostas; },
  async inserir(tab, row){
    const r = { ...row, id:uid(), tenant_id:'local', criado_em:new Date().toISOString(), atualizado_em:new Date().toISOString(), excluido_em:null };
    if(tab==='clientes' && r.documento && this.db.clientes.some(c => !c.excluido_em && c.documento===r.documento)) throw new Error('Já existe cliente ativo com este CNPJ/CPF.');
    if(tab==='propostas'){ r.ano = +r.data_proposta.slice(0,4); this.db.numeradores[r.ano] = (this.db.numeradores[r.ano]||0) + 1; r.numero = this.db.numeradores[r.ano];
      this.db.historico.push({ id:uid(), proposta_id:r.id, de:null, para:r.status, usuario_email:'modo local', criado_em:r.criado_em }); }
    this.db[tab].push(r); this.grava(); return r;
  },
  async alterar(tab, id, patch){
    const r = this.db[tab].find(x => x.id===id); if(!r) throw new Error('Registro não encontrado.');
    if(tab==='propostas'){
      if(r.status==='aprovada' && (patch.status===undefined || patch.status==='aprovada') && patch.itens!==undefined) throw new Error('Proposta aprovada não pode ter valores alterados. Volte o status antes.');
      if(patch.status!==undefined && patch.status!==r.status) this.db.historico.push({ id:uid(), proposta_id:id, de:r.status, para:patch.status, usuario_email:'modo local', criado_em:new Date().toISOString() });
    }
    if(tab==='clientes' && patch.documento && this.db.clientes.some(c => c.id!==id && !c.excluido_em && c.documento===patch.documento)) throw new Error('Já existe cliente ativo com este CNPJ/CPF.');
    Object.assign(r, patch, { atualizado_em:new Date().toISOString() }); this.grava(); return r;
  },
  async historico(id){ return this.db.historico.filter(h => h.proposta_id===id).sort((a,b) => a.criado_em < b.criado_em ? -1 : 1); },
  async salvarEscritorio(e){ this.db.tenant.escritorio = e; this.grava(); },
  async linhaDoTempo(id){ return (await this.historico(id)).map(h => ({ quando:h.criado_em, tipo:h.de ? 'status' : 'criada', quem:h.usuario_email, detalhe:{ de:h.de, para:h.para } })); },
  async signatarios(){ return []; }, async linksDe(){ return []; }, async assinaturas(){ return []; },
  async sair(){}
};

const Nuvem = {
  sb:null,
  async boot(){
    await new Promise((ok, erro) => { const s = document.createElement('script'); s.src = SUPABASE_JS; s.onload = ok; s.onerror = () => erro(new Error('Não foi possível carregar a biblioteca do Supabase. Verifique a internet.')); document.head.appendChild(s); });
    this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    const { data } = await this.sb.auth.getSession();
    return data.session ? 'ok' : 'login';
  },
  async entrar(email, senha){ const { error } = await this.sb.auth.signInWithPassword({ email, password:senha }); if(error) throw new Error(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message); },
  async sair(){ await this.sb.auth.signOut({ scope:'local' }); },   // só este navegador: não derruba o robô nem outras máquinas
  erro(e){
    const m = (e && e.message) || String(e);
    if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return new Error('Sem conexão com o banco de dados. Verifique a internet e tente de novo.');
    if(/PROP0\d\d/.test(m)){ const t = m.replace(/^.*PROP0\d\d:\s*/,''); return new Error(t.charAt(0).toUpperCase() + t.slice(1) + '.'); }
    if(e && e.code==='PGRST116') return new Error('Registro não encontrado ou sem permissão para alterá-lo.');
    if(e && e.code==='23505') return new Error('Já existe cliente ativo com este CNPJ/CPF.');
    if(e && e.code==='42501') return new Error('Sem permissão para esta operação (RLS). Confira se o usuário está vinculado ao escritório.');
    return new Error(m);
  },
  async todos(tabela, ordem){
    let out = [], de = 0; const passo = 1000;
    for(;;){ const { data, error } = await this.sb.from(tabela).select('*').is('excluido_em', null).order(ordem, { ascending:true }).range(de, de+passo-1);
      if(error) throw this.erro(error); out = out.concat(data); if(data.length < passo) break; de += passo; }
    return out;
  },
  async carregar(){
    const { data:u } = await this.sb.auth.getUser(); if(!u.user) throw new Error('Sessão expirada. Entre novamente.');
    S.email = u.user.email;
    const { data:v, error:e1 } = await this.sb.from('prop_usuarios_tenants').select('tenant_id,perfil').eq('usuario_id', u.user.id).eq('ativo', true).limit(1);
    if(e1) throw this.erro(e1);
    if(!v.length) throw new Error('Usuário sem vínculo com escritório. Rode o 01_setup de novo depois de criar o usuário no painel.');
    S.perfil = v[0].perfil;
    const { data:t, error:e2 } = await this.sb.from('prop_tenants').select('*').eq('id', v[0].tenant_id).single(); if(e2) throw this.erro(e2);
    t.escritorio = { ...ESCRITORIO_PADRAO, ...(t.escritorio||{}) }; S.tenant = t;
    [S.clientes, S.servicos, S.propostas] = await Promise.all([ this.todos('prop_clientes','nome'), this.todos('prop_servicos','ordem'), this.todos('prop_propostas','criado_em') ]);
  },
  async inserir(tab, row){ const { data, error } = await this.sb.from(TAB[tab]).insert({ ...row, tenant_id:S.tenant.id }).select().single(); if(error) throw this.erro(error); S[tab].push(data); return data; },
  async alterar(tab, id, patch){ const { data, error } = await this.sb.from(TAB[tab]).update(patch).eq('id', id).select().single(); if(error) throw this.erro(error); const i = S[tab].findIndex(x => x.id===id); if(i>=0) S[tab][i] = data; return data; },
  async historico(id){ const { data, error } = await this.sb.from('prop_historico').select('*').eq('proposta_id', id).order('criado_em'); if(error) throw this.erro(error); return data; },
  async linhaDoTempo(id){ const { data, error } = await this.sb.rpc('prop_linha_do_tempo', { p_proposta:id }); if(error) throw this.erro(error); return data; },
  async signatarios(id){ const { data, error } = await this.sb.from('prop_signatarios').select('*').eq('proposta_id', id).is('excluido_em', null).order('ordem').order('criado_em'); if(error) throw this.erro(error); return data; },
  async salvarSignatario(id, row){ const q = id ? this.sb.from('prop_signatarios').update(row).eq('id', id) : this.sb.from('prop_signatarios').insert({ ...row, tenant_id:S.tenant.id }); const { error } = await q.select().single(); if(error) throw this.erro(error); },
  async linksDe(id){ const { data, error } = await this.sb.from('prop_links').select('id,signatario_id,tipo,canal,enviado_para,criado_em,enviado_em,expira_em,acessos,primeiro_acesso_em,ultimo_acesso_em').eq('proposta_id', id).is('revogado_em', null); if(error) throw this.erro(error); return data; },
  async assinaturas(id){ const { data, error } = await this.sb.rpc('prop_assinaturas_ver', { p_proposta:id }); if(error) throw this.erro(error); return data || []; },
  async recarregar(id){ const { data, error } = await this.sb.from('prop_propostas').select('*').eq('id', id).single(); if(error) throw this.erro(error); const i = S.propostas.findIndex(x => x.id===id); if(i>=0) S.propostas[i] = data; return data; },
  async linkSignatario(sid, tipo, canal){ const { data, error } = await this.sb.rpc('prop_link_signatario', { p_signatario:sid, p_tipo:tipo, p_canal:canal }); if(error) throw this.erro(error); return data; },
  async linkEnvio(linkId, ok){ const { error } = await this.sb.rpc('prop_link_envio', { p_link:linkId, p_ok:ok }); if(error) throw this.erro(error); },
  async revogarUm(sid, tipo){ const { error } = await this.sb.rpc('prop_link_revogar_um', { p_signatario:sid, p_tipo:tipo }); if(error) throw this.erro(error); },
  async escritorioAssinar(id, nome, cpf){ const { data, error } = await this.sb.rpc('prop_escritorio_assinar', { p_proposta:id, p_nome:nome, p_cpf:cpf, p_user_agent:navigator.userAgent }); if(error) throw this.erro(error); await this.recarregar(id); return data; },
  // mesmo canal do Cobrança Pro: a Edge Function mail-proxy valida o login e repassa ao Artecon Mail (a chave fica em secret, nunca no HTML)
  async enviarEmail(m){ const { data:{ session } } = await this.sb.auth.getSession(); if(!session) throw new Error('Sessão expirada. Entre novamente.');
    let r; try{ r = await fetch(CFG.SUPABASE_URL + '/functions/v1/mail-proxy', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token, 'apikey':CFG.SUPABASE_ANON_KEY }, body:JSON.stringify({ to:m.to, assunto:m.assunto, html:m.html, app:'propostas' }) }); }catch(e){ throw new Error('Não foi possível falar com o serviço de e-mail. Verifique a internet.'); }
    if(!r.ok){ const t = await r.text().catch(() => ''); throw new Error(`O serviço de e-mail recusou o envio (${r.status}): ${t.slice(0,140)}`); } },
  async salvarEscritorio(e){ const { data, error } = await this.sb.from('prop_tenants').update({ escritorio:e }).eq('id', S.tenant.id).select(); if(error) throw this.erro(error); if(!data.length) throw new Error('Somente o diretor pode alterar os dados do escritório.'); S.tenant.escritorio = e; }
};

let _t; function toast(msg, erro){ const t = $('toast'); t.textContent = msg; t.className = 'toast' + (erro ? ' erro' : ''); t.hidden = false; clearTimeout(_t); _t = setTimeout(() => t.hidden = true, erro ? 6000 : 2600); }
async function tenta(fn){ try{ return await fn(); }catch(e){ console.error(e); toast(e.message || String(e), true); return undefined; } }
const ativos = arr => arr.filter(x => !x.excluido_em);
const propostasOrdenadas = () => ativos(S.propostas).slice().sort((a,b) => (b.ano - a.ano) || (b.numero - a.numero));
const selo = s => `<span class="selo ${esc(s)}">${esc(STATUS[s] || s)}</span>`;

function hashDe(view){ if(view==='documento') return (S.docId && !S.docPrevia) ? '#/proposta/' + S.docId : null; if(view==='form') return null; return '#/' + view; }
function rota(){
  const h = location.hash;
  if(S._hashInterno === h){ S._hashInterno = null; return; }
  const m = h.match(/^#\/proposta\/([0-9a-f-]{36})$/i);
  if(m){ const p = S.propostas.find(x => x.id===m[1].toLowerCase() && !x.excluido_em);
    if(p){ S.docPrevia = null; S.docId = p.id; ir('documento'); } else { ir('propostas'); toast('Proposta não encontrada ou sem acesso para este usuário.', true); } return; }
  const v = h.replace(/^#\//,''); ir(VIEWS[v] && v!=='form' && v!=='documento' ? v : 'painel');
}
window.addEventListener('hashchange', () => { if(S.modoCliente) return; if(/^#\/c\//.test(location.hash)){ location.reload(); return; } if(S.tenant && S.view!=='form') rota(); else if(S.tenant && S.view==='form' && S._hashInterno!==location.hash){ if(confirm('Sair do formulário? O que não foi salvo será perdido.')) rota(); } });
function ir(view){ S.view = view; document.querySelectorAll('.menu button').forEach(b => b.classList.toggle('ativo', b.dataset.ir === (view==='form' || view==='documento' ? 'propostas' : view))); VIEWS[view](); window.scrollTo(0,0); const h = hashDe(S.view); if(h && location.hash !== h){ S._hashInterno = h; location.hash = h; } }
function topo(titulo, sub, botoes){ return `<div class="topo"><div><h1>${esc(titulo)}</h1><p>${esc(sub)}</p></div><div class="acoes">${botoes || ''}</div></div>`; }

/* ===================== TELAS ===================== */
const VIEWS = {
  painel(){
    const k = indicadores(S.propostas, hojeISO()); const mes = MESES[new Date().getMonth()];
    const max = Math.max(1, ...k.funil.map(f => f[1]));
    const avisos = k.vencidas.map(p => `<div class="aviso"><span>Proposta ${esc(numeroFmt(p))} de <b>${esc(p.cliente_nome)}</b> venceu em ${dataBR(p.validade)} e continua ${esc(STATUS[p.status].toLowerCase())}.</span><button class="btn mini" data-act="doc" data-id="${p.id}">Abrir</button></div>`).join('')
      + k.vencendo.map(p => `<div class="aviso ambar"><span>Proposta ${esc(numeroFmt(p))} de <b>${esc(p.cliente_nome)}</b> vence em ${dataBR(p.validade)}.</span><button class="btn mini" data-act="doc" data-id="${p.id}">Abrir</button></div>`).join('');
    $('conteudo').innerHTML = topo('Visão geral','Desempenho comercial das propostas de honorários.','<button class="btn primario" data-act="nova">Nova proposta</button>') + `
    <div class="indicadores">
      <div class="ind"><div class="rot">Propostas em ${mes}</div><div class="val">${k.noMes}</div><div class="sub">${k.total} no total</div></div>
      <div class="ind"><div class="rot">Em aberto</div><div class="val">${k.abertas}</div><div class="sub">${brl(k.abertasMensal)}/mês${k.abertasPontual ? ' + ' + brl(k.abertasPontual) + ' pontual' : ''}</div></div>
      <div class="ind"><div class="rot">Taxa de aprovação</div><div class="val">${k.taxa===null ? '—' : k.taxa + '%'}</div><div class="sub">${k.decididas ? 'sobre ' + k.decididas + ' decidida' + (k.decididas>1?'s':'') + ' (aprovadas + perdidas)' : 'nenhuma proposta decidida ainda'}</div></div>
      <div class="ind"><div class="rot">Honorários aprovados</div><div class="val">${brl(k.aprovMensal)}</div><div class="sub">por mês${k.aprovPontual ? ' + ' + brl(k.aprovPontual) + ' pontual' : ''}</div></div>
    </div>
    ${(() => { const at = ativos(S.propostas), abre = p => `<button class="btn mini" data-act="doc" data-id="${p.id}">Abrir</button>`;
      const a1 = at.filter(p => !p.assinada_em && p.clientes_assinaram_em && !p.escritorio_assinou_em && (p.status==='enviada'||p.status==='negociacao')).map(p => `<div class="aviso"><span>Proposta ${esc(numeroFmt(p))} de <b>${esc(p.cliente_nome)}</b>: os clientes já assinaram (${esc(dataHora(p.clientes_assinaram_em))}). <b>Falta a assinatura do escritório.</b></span>${abre(p)}</div>`);
      const a2 = at.filter(p => p.assinada_em && p.escritorio_assinou_em && !p.via_enviada_em).map(p => `<div class="aviso ambar"><span>Proposta ${esc(numeroFmt(p))} de <b>${esc(p.cliente_nome)}</b> foi assinada por todos em ${esc(dataHora(p.assinada_em))}. <b>A via assinada ainda não foi enviada.</b></span>${abre(p)}</div>`);
      return a1.length || a2.length ? `<div class="painel"><h2>Assinaturas pendentes</h2>${a1.join('')}${a2.join('')}</div>` : ''; })()}
    ${avisos ? `<div class="painel"><h2>Validade</h2>${avisos}</div>` : ''}
    <div class="duas">
      <div class="painel"><h2>Propostas recentes</h2>${tabelaPropostas(propostasOrdenadas().slice(0,6), true)}</div>
      <div class="painel"><h2>Funil comercial</h2>${k.funil.map(([s,n]) => `<div class="funil-linha"><span>${esc(STATUS[s])}</span><b>${n}</b></div><div class="barra"><i style="width:${n ? Math.max(3, n/max*100) : 0}%"></i></div>`).join('')}</div>
    </div>`;
  },

  propostas(){
    $('conteudo').innerHTML = topo('Propostas','Consulte, filtre e acompanhe cada oportunidade.','<button class="btn primario" data-act="nova">Nova proposta</button>') + `
    <div class="painel"><div class="filtros">
      <input type="text" id="busca" placeholder="Buscar por número, cliente, contato ou CNPJ/CPF" value="${esc(S.busca)}">
      <select id="filtroStatus" style="width:200px"><option value="">Todos os status</option>${STATUS_ORDEM.map(s => `<option value="${s}" ${S.filtroStatus===s?'selected':''}>${esc(STATUS[s])}</option>`).join('')}</select>
    </div><div id="listaPropostas"></div></div>`;
    listarPropostas();
  },

  clientes(){
    const arr = ativos(S.clientes).slice().sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
    const linhas = arr.map(c => {
      const ps = ativos(S.propostas).filter(p => p.cliente_id===c.id);
      const ult = ps.map(p => String(p.atualizado_em || p.criado_em || '').slice(0,10)).sort().pop();
      return `<tr><td><b>${esc(c.nome)}</b><br><small>${esc(docFmt(c.documento)) || 'sem CNPJ/CPF'}</small></td><td>${esc([c.tratamento,c.contato].filter(Boolean).join(' ')) || '—'}<br><small>${esc(c.email||'')} ${esc(c.telefone||'')}</small></td><td class="num">${ps.length}</td><td>${ult ? dataBR(ult) : '—'}</td>
      <td class="acoes-linha"><button class="btn mini" data-act="nova" data-cliente="${c.id}">Nova proposta</button> <button class="btn mini" data-act="cliente" data-id="${c.id}">Editar</button> <button class="btn mini" data-act="excluirCliente" data-id="${c.id}">Excluir</button></td></tr>`; }).join('');
    $('conteudo').innerHTML = topo('Clientes','Empresas e contatos para as propostas.','<button class="btn primario" data-act="cliente">Novo cliente</button>') +
      `<div class="painel rolagem">${arr.length ? `<table class="lista"><thead><tr><th>Cliente</th><th>Contato</th><th class="num">Propostas</th><th>Última movimentação</th><th></th></tr></thead><tbody>${linhas}</tbody></table>` : '<div class="vazio">Nenhum cliente ainda. Cadastre aqui ou direto ao criar a proposta.</div>'}</div>`;

function linhaTempoHTML(x){
  const d = x.detalhe || {}, quem = x.quem ? ' · ' + esc(x.quem) : '';
  let t = '', extra = '';
  if(x.tipo==='criada') t = 'Proposta criada';
  else if(x.tipo==='status') t = `Status: ${esc(STATUS[d.de]||d.de)} → <b>${esc(STATUS[d.para]||d.para)}</b>`;
  else if(x.tipo==='alteracao'){ const l = descreveAlteracao(d); t = 'Conteúdo alterado'; extra = `<ul class="dif">${l.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`; }
  else if(x.tipo==='link_gerado' || x.tipo==='via_gerada'){ const via = d.canal==='whatsapp' ? 'WhatsApp' : d.canal==='email' ? 'e-mail' : null;
    t = `${x.tipo==='via_gerada' ? 'Via assinada (só leitura)' : 'Link de assinatura'}${d.signatario ? ' para <b>' + esc(d.signatario) + '</b>' : ''}${via ? ' por ' + via + (d.para ? ' (' + esc(d.para) + ')' : '') : ''}${via && d.enviado===false ? ' — <span class="vencida">envio não confirmado</span>' : ''}, vale até ${esc(dataHora(d.expira_em))}`; }
  else if(x.tipo==='link_cancelado') t = `Link ${d.signatario ? 'de ' + esc(d.signatario) + ' ' : ''}cancelado${({ substituido:' (substituído por um novo)', cancelado_pelo_escritorio:' pelo escritório', falha_no_envio:' porque o envio falhou', signatario_removido:' (signatário removido)', contato_alterado:' (contato alterado)' })[d.motivo] || ''}`;
  else if(x.tipo==='cliente_abriu') t = `Abriu a proposta pela primeira vez${d.acessos>1 ? ` (${d.acessos} acessos; último em ${esc(dataHora(d.ultimo_acesso_em))})` : ''}`;
  else if(x.tipo==='via_aberta') t = `Abriu a via assinada${d.acessos>1 ? ` (${d.acessos} acessos)` : ''}`;
  else if(x.tipo==='assinada') t = `<b>Assinou eletronicamente</b> — código ${esc(d.codigo)}${d.foto ? ', com foto do documento' : ''}`;
  else if(x.tipo==='assinada_escritorio') t = `<b>Assinou pelo escritório</b> — código ${esc(d.codigo)}`;
  else t = esc(x.tipo);
  return `<li class="lt-${esc(x.tipo==='assinada_escritorio' ? 'assinada' : x.tipo==='via_gerada' ? 'link_gerado' : x.tipo==='via_aberta' ? 'cliente_abriu' : x.tipo)}"><span class="lt-quando">${esc(dataHora(x.quando))}</span> ${t}<small>${quem}</small>${extra}</li>`;
}

  return { assunto:`Proposta de Honorários nº ${n} — ${S.tenant.nome}`, zap:`Olá, ${prim}! Segue a Proposta de Honorários nº ${n} da ${S.tenant.nome} para leitura e assinatura eletrônica: ${url}`,
    html:emailHTML('Proposta de Honorários', `<p>Olá, ${esc(prim)}!</p><p>Segue a <b>Proposta de Honorários nº ${esc(n)}</b>, preparada para ${esc(p.cliente_nome)}. No endereço abaixo você lê a proposta completa e, estando de acordo, assina eletronicamente ali mesmo.</p>${p.exige_foto ? '<p>Para assinar será pedida uma foto sua segurando um documento com foto.</p>' : ''}${p.validade ? `<p>Validade da proposta: ${esc(dataBR(p.validade))}.</p>` : ''}`, 'Ler e assinar a proposta', url) };
}
async function enviarLink(p, sig, tipo, canal, janela){
  const r = await DB.linkSignatario(sig.id, tipo, canal), url = urlCliente(r.token), tx = textoEnvio(p, sig, tipo, url);
  if(canal==='email'){
    try{ await DB.enviarEmail({ to:sig.email, assunto:tx.assunto, html:tx.html }); }catch(e){ await DB.linkEnvio(r.link_id, false).catch(() => {}); throw e; }
    await DB.linkEnvio(r.link_id, true);
  } else {
    const wa = 'https://wa.me/' + zapNumero(sig.celular) + '?text=' + encodeURIComponent(tx.zap);
    if(janela && !janela.closed) janela.location = wa; else { try{ await navigator.clipboard.writeText(tx.zap); }catch(e){} toast('O navegador bloqueou a janela do WhatsApp. A mensagem foi copiada: cole na conversa do cliente.', true); }
    await DB.linkEnvio(r.link_id, true);
  }
}

    <p><b>Em nome da equipe da</b> ${esc(nomeEsc)}<b>,</b> agradecemos a confiança e permanecemos à disposição para quaisquer esclarecimentos adicionais.</p>
    <p>Atenciosamente,</p>
    <div class="assinatura">_____________________________<br>${esc(e.responsavel)}<br>${esc(e.registro)}</div>
    ${c.aceite ? `<div class="aceite"><b>TERMO DE ACEITE</b><p style="margin:3mm 0 0">Declaro que li e estou de acordo com as condições desta proposta${p.numero ? ' nº ' + esc(numeroFmt(p)) : ''}, autorizando a elaboração do contrato de prestação de serviços contábeis.</p><div class="linhas"><div>${esc(p.cliente_nome)}${p.cliente_documento ? '<br>' + esc(docFmt(p.cliente_documento)) : ''}</div><div>Local e data</div></div></div>` : ''}
    ${ass && (Array.isArray(ass) ? ass.length : true) ? comprovanteHTML(p, Array.isArray(ass) ? ass : [ass], op || {}) : ''}
  </div></td></tr></tbody></table></div>`;
}
function comprovanteHTML(p, lista, op){
  const L = (r, v) => v ? `<tr><th>${r}</th><td>${v}</td></tr>` : '';
  const bloco = (a, i) => { const cpf = /^\d{11}$/.test(a.cpf || '') ? docFmt(a.cpf) : a.cpf;
    return `<div class="ass-bloco"><h4>${i+1}. ${a.papel==='escritorio' ? 'Pelo escritório' : 'Pelo cliente'} — ${esc(a.nome)}</h4><table>
    ${L('CPF', esc(cpf))}${L('E-mail', esc(a.email))}${L('Qualidade', esc(a.cargo || ''))}
    ${a.papel==='escritorio' ? L('Acesso', 'usuário e senha pessoais no sistema') : L('Link recebido por', a.canal==='email' ? 'e-mail enviado pelo sistema' + (a.enviado_para ? ' para ' + esc(a.enviado_para) : '') + ', sem exibição do endereço ao escritório' : a.canal==='whatsapp' ? 'WhatsApp, entregue pelo escritório' + (a.enviado_para ? ' para ' + esc(a.enviado_para) : '') : '')}
    ${L('Data e hora', esc(dataHora(a.assinado_em)) + ' (horário de Brasília)')}${L('Endereço IP', esc(a.ip || ''))}${L('Navegador', esc(a.user_agent || ''))}
    ${L('Código de verificação', '<b>' + esc(a.codigo) + '</b>')}${L('Hash SHA-256 do conteúdo', '<span class="hash">' + esc(a.hash_documento) + '</span>')}
    ${a.foto_hash ? L('Foto com documento', (a.foto && op.fotos ? `<img src="${esc(a.foto)}" alt="Foto do signatário com o documento" class="ass-foto"><br>` : 'registrada — ') + '<span class="hash">SHA-256 ' + esc(a.foto_hash) + '</span>') : ''}</table>
    <p><b>Declaração:</b> ${esc(a.declaracao)}</p></div>`; };
  const hashes = [...new Set(lista.map(a => a.hash_documento))];
  return `<div class="comprovante"><h3 style="margin-top:0">COMPROVANTE DE ASSINATURA ELETRÔNICA</h3>
    <p>Proposta de Honorários nº ${esc(numeroFmt(p))} — ${esc(p.cliente_nome)} · ${lista.length} assinatura${lista.length>1?'s':''}${hashes.length===1 && lista.length>1 ? ' sobre o mesmo conteúdo (mesmo hash)' : ''}.</p>
    ${lista.map(bloco).join('')}
    <p style="font-size:9pt">O hash identifica exatamente o conteúdo aceito (cliente, serviços, valores, condições e validade); qualquer alteração produziria outro hash. Registro feito pelo sistema de propostas da ${esc(S.tenant ? S.tenant.nome : '')}.</p></div>`;
}
function baixar(nome, conteudo, tipo){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type:tipo })); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function nomeArquivo(p){ return 'Proposta_' + (p.numero ? numeroFmt(p).replace('/','-') + '_' : '') + p.cliente_nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').slice(0,50); }
function wordHTML(p){
  const e = esc_(), secoes = clausulas(p, e), c = p.condicoes || {}, dirigido = [p.tratamento, p.contato].filter(Boolean).join(' '), assunto = String(p.assunto||'').trim();

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(nomeArquivo(p))}</title><style>@page{size:21cm 29.7cm;margin:2.2cm 2.2cm 2cm 2.2cm}body{font-family:Arial;font-size:10.5pt;color:#1d1d1d}</style></head><body>
  <table width="100%" style="border-bottom:2.5pt solid #4F4C4D;margin-bottom:14pt"><tr><td style="font-family:'Niagara Solid','Bookman Old Style',Georgia;font-size:30pt;color:#4F4C4D">Artecon<br><span style="font-family:'Bookman Old Style',Georgia;font-size:11pt;color:#BC151B">artes contábeis</span></td><td align="right" style="font-size:9pt;color:#4F4C4D"><b>${esc(e.endereco)}</b><br>${esc(e.telefone)} - ${esc(e.site)}${p.numero ? '<br>Proposta nº ' + esc(numeroFmt(p)) : ''}</td></tr></table>
  <p ${P}>${esc(e.cidade)}, ${esc(dataExtenso(p.data_proposta))}.</p>
  <p style="margin:0 0 9pt"><b>${esc(p.cliente_nome)}</b>${p.cliente_documento ? ' — ' + esc(docFmt(p.cliente_documento)) : ''}${dirigido && dirigido.toLowerCase()!==p.cliente_nome.toLowerCase() ? '<br>' + esc(dirigido) : ''}</p>
  <p ${P}>Proposta de Honorários de Serviços Contábeis${assunto ? ' – ' + esc(assunto) : ''}.</p><p ${P}>Olá,</p>
  <p ${P}>Estamos comprometidos com a segurança financeira de nossos clientes por meio do nosso modelo de negócios e dos valores que norteiam nossas ações, agindo com transparência, integridade e respeito às pessoas e organizações. Seja bem-vindo!</p>
  ${p.abertura ? `<p ${P}>${esc(p.abertura)}</p>` : ''}
  ${secoes.map(s => `<p style="margin:14pt 0 9pt"><b>${s.n}. ${esc(s.titulo)}</b></p>` + s.clausulas.map(k => `<p ${P}>${k.n} ${esc(k.texto)}</p>` + (k.lista && k.lista.length ? `<ul>${k.lista.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : '') + (k.alineas||[]).map(a => `<p style="margin:0 0 6pt 24pt">${esc(a)}</p>`).join('')).join('')).join('')}
  <p ${P}>Em nome da equipe da ${esc(S.tenant ? S.tenant.nome : 'Artecon Artes Contábeis')}, agradecemos a confiança e permanecemos à disposição para quaisquer esclarecimentos adicionais.</p><p ${P}>Atenciosamente,</p>
  <p style="text-align:center;margin-top:36pt">_____________________________<br>${esc(e.responsavel)}<br>${esc(e.registro)}</p>
  ${c.aceite ? `<p style="margin-top:24pt"><b>TERMO DE ACEITE</b></p><p ${P}>Declaro que li e estou de acordo com as condições desta proposta${p.numero ? ' nº ' + esc(numeroFmt(p)) : ''}, autorizando a elaboração do contrato de prestação de serviços contábeis.</p><p style="margin-top:30pt">_____________________________<br>${esc(p.cliente_nome)}</p>` : ''}
  </body></html>`;
}
