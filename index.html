/* ===================== AÇÕES ===================== */
const ACOES = {
  nova(el){ S.F = novaF(el.dataset.cliente); S.errosForm = []; S.docPrevia = null; ir('form'); },
  editar(el){ const p = S.propostas.find(x => x.id===el.dataset.id); if(!p || p.status==='aprovada') return; S.F = copiaF(p); S.docPrevia = null; ir('form'); },
  duplicar(el){ const p = S.propostas.find(x => x.id===el.dataset.id); if(!p) return; S.F = copiaF(p, true); S.docPrevia = null; ir('form'); toast('Cópia aberta como nova proposta. Revise e salve.'); },
  doc(el){ S.docPrevia = null; S.docId = el.dataset.id; ir('documento'); },
  irPropostas(){ ir('propostas'); },
  previa(){ const F = leF(); const er = validarProposta(F); if(er.length){ toast(er[0], true); return; } S.docPrevia = JSON.parse(JSON.stringify(F)); ir('documento'); },
  voltarForm(){ S.docPrevia = null; ir('form'); },
  imprimir(){ window.print(); },
  async reabrir(){ const p = S.propostas.find(x => x.id===S.docId); if(!p) return;
    if(!confirm(`Voltar a proposta ${numeroFmt(p)} de ${STATUS[p.status]} para Enviada? A mudança fica registrada no histórico.`)) return;
    await tenta(async () => { await DB.alterar('propostas', p.id, { status:'enviada' }); toast('Proposta reaberta como Enviada.'); VIEWS.documento(); }); },
  sigEditar(el){ dlgSignatario(el.dataset.id); },
  async sigSalvar(el){
    const row = { nome:$('g_nome').value.trim().replace(/\s+/g,' '), qualidade:$('g_qual').value.trim()||null, email:$('g_email').value.trim().toLowerCase()||null, celular:$('g_cel').value.replace(/\D/g,'')||null };
    if(row.nome.length<5 || !row.nome.includes(' ')){ toast('Informe o nome completo do signatário.', true); return; }
    if(!row.email && !row.celular){ toast('Informe o e-mail ou o celular.', true); return; }
    if(row.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(row.email)){ toast('E-mail inválido.', true); return; }
    if(row.celular && !/^\d{10,13}$/.test(row.celular)){ toast('Celular inválido. Use DDD + número, só dígitos.', true); return; }
    if(!el.dataset.id){ row.proposta_id = S.docId; row.ordem = S.doc.sigs.length + 1; }
    await tenta(async () => { await DB.salvarSignatario(el.dataset.id || null, row); $('dlg').close(); toast('Signatário salvo.'); VIEWS.documento(); }); },
  async sigRemover(el){ const s = S.doc.sigs.find(x => x.id===el.dataset.id); if(!s || !confirm(`Remover ${s.nome} dos signatários? O link dele, se houver, deixa de funcionar.`)) return;
    await tenta(async () => { await DB.salvarSignatario(s.id, { excluido_em:new Date().toISOString() }); await DB.recarregar(S.docId); toast('Signatário removido.'); VIEWS.documento(); }); },
  async sigCancelar(el){ if(!confirm('Cancelar o link desta pessoa? O endereço que ela recebeu deixa de funcionar.')) return;
    await tenta(async () => { await DB.revogarUm(el.dataset.id, 'assinatura'); toast('Link cancelado.'); VIEWS.documento(); }); },
  async sigEnviar(el){ const p = S.propostas.find(x => x.id===S.docId), s = S.doc.sigs.find(x => x.id===el.dataset.id); if(!p || !s) return;
    const { tipo, canal } = el.dataset, tinha = S.doc.links.some(l => l.signatario_id===s.id && l.tipo===tipo);
    if(tinha && tipo==='assinatura' && !confirm('Já existe um link enviado a esta pessoa. Enviar outro cancela o anterior. Continuar?')) return;
    const janela = canal==='whatsapp' ? window.open('about:blank', '_blank') : null;      // aberta já no clique, senão o navegador bloqueia
    el.disabled = true;
    const ok = await tenta(async () => { await enviarLink(p, s, tipo, canal, janela); await DB.recarregar(p.id); return true; });
    if(!ok && janela) janela.close();
    if(ok) toast(canal==='email' ? `E-mail enviado para ${s.email}.` : 'WhatsApp aberto com a mensagem pronta: confira o contato e envie.');
    VIEWS.documento(); },
  async sigEnviarTodos(){ const p = S.propostas.find(x => x.id===S.docId); if(!p) return; const falhas = []; let n = 0;
    const alvo = S.doc.sigs.filter(s => s.email && !S.doc.ass.some(a => a.signatario_id===s.id) && !S.doc.links.some(l => l.signatario_id===s.id && l.tipo==='assinatura'));
    for(const s of alvo){ try{ await enviarLink(p, s, 'assinatura', 'email'); n++; }catch(e){ falhas.push(`${s.nome}: ${e.message}`); } }
    await DB.recarregar(p.id).catch(() => {});
    if(falhas.length) toast('Não enviado para ' + falhas.join(' | '), true); else toast(`E-mail enviado a ${n} signatário${n===1?'':'s'}.`);
    VIEWS.documento(); },
  async viaTodos(){ const p = S.propostas.find(x => x.id===S.docId); if(!p) return; await tenta(async () => { await enviarViaATodos(p); await DB.recarregar(p.id); }); VIEWS.documento(); },
  escAssinar(){ dlgEscritorio(); },
  async escConfirmar(){ const p = S.propostas.find(x => x.id===S.docId), nome = $('x_nome').value.trim().replace(/\s+/g,' '), cpf = soDoc($('x_cpf').value);
    if(nome.length<5 || !nome.includes(' ')){ toast('Informe o nome completo.', true); return; } if(!cpfValido(cpf)){ toast('CPF inválido.', true); return; } if(!$('x_ok').checked){ toast('Marque a declaração para assinar.', true); return; }
    await tenta(async () => { const r = await DB.escritorioAssinar(p.id, nome, cpf); $('dlg').close();
      if(r.concluida){ toast('Assinado. Todas as assinaturas concluídas: enviando a via aos signatários…'); const p2 = S.propostas.find(x => x.id===p.id); await enviarViaATodos(p2, true); await DB.recarregar(p.id); }
      else toast('Assinatura do escritório registrada. Falta a assinatura dos clientes.');
      VIEWS.documento(); }); },
  async copiarLink(){ const url = location.href.split('#')[0] + '#/proposta/' + S.docId; try{ await navigator.clipboard.writeText(url); toast('Link da proposta copiado.'); }catch(e){ prompt('Copie o link da proposta:', url); } },
  word(){ const p = S.docPrevia || S.propostas.find(x => x.id===S.docId) || S.docCliente; baixar(nomeArquivo(p) + '.doc', '\ufeff' + wordHTML(p), 'application/msword'); },
  salvarProposta(){ salvarProposta(); },
  addItem(){ S.F.itens.push({ nome:'', descricao:'', tipo:S.F.modelo==='pontual' ? 'pontual' : 'mensal', valor:0, qtd:0 }); desenhaItens(); desenhaCondicoes(); },
  delItem(el){ S.F.itens.splice(+el.dataset.i, 1); desenhaItens(); desenhaCondicoes(); },
  addParcela(){ S.F.condicoes.parcelas.push({ valor:0, descricao:'' }); desenhaCondicoes(); },
  delParcela(el){ S.F.condicoes.parcelas.splice(+el.dataset.i, 1); desenhaCondicoes(); },
  meioMeio(){ const t = totais(S.F.itens).pontual; if(!t){ toast('Informe antes o valor do serviço pontual.', true); return; } const a = r2(t/2); S.F.condicoes.parcelas = [{ valor:a, descricao:'na aceitação da proposta;' },{ valor:r2(t-a), descricao:'no término dos trabalhos, com a entrega do material.' }]; desenhaCondicoes(); },
  async excluirProposta(el){ const p = S.propostas.find(x => x.id===el.dataset.id); if(!p || !confirm(`Excluir a proposta ${numeroFmt(p)} de ${p.cliente_nome}? O número não é reaproveitado.`)) return;
    await tenta(async () => { await DB.alterar('propostas', p.id, { excluido_em:new Date().toISOString() }); toast('Proposta excluída.'); ir(S.view); }); },
  cliente(el){ dlgCliente(el.dataset.id); },
  servico(el){ dlgServico(el.dataset.id); },
  fecharDlg(){ $('dlg').close(); },
  async salvarCliente(el){
    const row = { nome:$('d_nome').value.trim(), documento:soDoc($('d_doc').value)||null, tratamento:$('d_trat').value||null, contato:$('d_contato').value.trim()||null, email:$('d_email').value.trim()||null, telefone:$('d_tel').value.trim()||null };
    if(!row.nome){ toast('Informe o nome do cliente.', true); return; } if(!docValido(row.documento)){ toast('CNPJ/CPF inválido. Confira os dígitos ou deixe em branco.', true); return; }
    await tenta(async () => { if(el.dataset.id) await DB.alterar('clientes', el.dataset.id, row); else await DB.inserir('clientes', row); $('dlg').close(); toast('Cliente salvo.'); ir('clientes'); });
  },
  async excluirCliente(el){ const c = S.clientes.find(x => x.id===el.dataset.id); if(!c || !confirm(`Excluir o cliente ${c.nome}? As propostas dele continuam guardadas.`)) return;
    await tenta(async () => { await DB.alterar('clientes', c.id, { excluido_em:new Date().toISOString() }); toast('Cliente excluído.'); ir('clientes'); }); },
  async salvarServico(el){
    const row = { nome:$('s_nome').value.trim(), descricao:$('s_desc').value.trim()||null, tipo:$('s_tipo').value, valor_padrao:parseValor($('s_valor').value), ordem:parseInt($('s_ordem').value)||0 };
    if(!row.nome){ toast('Informe o nome do serviço.', true); return; }
    await tenta(async () => { if(el.dataset.id) await DB.alterar('servicos', el.dataset.id, row); else await DB.inserir('servicos', row); $('dlg').close(); toast('Serviço salvo.'); ir('servicos'); });
  },
  async excluirServico(el){ const s = S.servicos.find(x => x.id===el.dataset.id); if(!s || !confirm(`Excluir o serviço ${s.nome} do catálogo? Propostas já feitas não mudam.`)) return;
    await tenta(async () => { await DB.alterar('servicos', s.id, { excluido_em:new Date().toISOString() }); toast('Serviço excluído.'); ir('servicos'); }); },
  async salvarEscritorio(){
    const e = { ...esc_() }; document.querySelectorAll('[data-e]').forEach(i => e[i.dataset.e] = i.value.trim());
    e.dia_vencimento = Math.min(31, Math.max(1, parseInt(e.dia_vencimento)||20)); e.validade_dias = Math.max(1, parseInt(e.validade_dias)||10); e.valor_funcionario = parseValor(e.valor_funcionario); e.cpf_responsavel = soDoc(e.cpf_responsavel || '');
    if(e.cpf_responsavel && !cpfValido(e.cpf_responsavel)){ toast('CPF de quem assina pelo escritório está inválido.', true); return; }
    await tenta(async () => { await DB.salvarEscritorio(e); toast('Dados do escritório salvos.'); ir('escritorio'); });
  },
  backup(){ baixar(`backup_propostas_${hojeISO()}.json`, JSON.stringify({ app:'artecon-propostas', versao:APP_VERSION, gerado_em:new Date().toISOString(), tenant:S.tenant, clientes:S.clientes, servicos:S.servicos, propostas:S.propostas }, null, 2), 'application/json'); },
  async sair(){ await DB.sair(); location.reload(); }
};

document.addEventListener('click', ev => {
  const n = ev.target.closest('[data-ir]'); if(n){ ir(n.dataset.ir); return; }
  const a = ev.target.closest('[data-act]'); if(a && !a.disabled && ACOES[a.dataset.act]){ ev.preventDefault(); ACOES[a.dataset.act](a); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.id==='busca'){ S.busca = el.value; listarPropostas(); return; }
  if(!S.F) return;
  if(el.dataset.f){ S.F[el.dataset.f] = el.value; if(el.dataset.f==='cliente_nome'){ const c = ativos(S.clientes).find(x => x.nome.trim().toLowerCase()===el.value.trim().toLowerCase()); S.F.cliente_id = c ? c.id : null; if(c){ S.F.cliente_documento = c.documento||''; S.F.contato = c.contato||''; S.F.tratamento = c.tratamento||''; $('f_doc').value = docFmt(c.documento); $('f_contato').value = c.contato||''; $('f_trat').value = c.tratamento||''; } dicaCliente(); } return; }
  if(el.dataset.i!==undefined && el.dataset.k){ const it = S.F.itens[+el.dataset.i]; if(!it) return; const k = el.dataset.k; it[k] = k==='valor' ? parseValor(el.value) : k==='qtd' ? (parseInt(el.value)||0) : el.value; if(k==='valor' || k==='qtd') recalcula(); return; }
  if(el.dataset.p!==undefined){ const pa = S.F.condicoes.parcelas[+el.dataset.p]; if(!pa) return; pa[el.dataset.k] = el.dataset.k==='valor' ? parseValor(el.value) : el.value; recalcula(); return; }
  if(el.dataset.c && el.type!=='checkbox'){ S.F.condicoes[el.dataset.c] = el.value; }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if(el.id==='incFotos'){ const p = S.propostas.find(x => x.id===S.docId); if(p) $('docArea').innerHTML = docHTML(p, S.doc.ass, { fotos:el.checked }); return; }
  if(el.id==='filtroStatus'){ S.filtroStatus = el.value; listarPropostas(); return; }
  if(el.dataset.status){ const id = el.dataset.status, novo = el.value; const r = await tenta(async () => { await DB.alterar('propostas', id, { status:novo }); toast('Status atualizado para ' + STATUS[novo] + '.'); return true; }); listarPropostas(); if(!r) return; return; }
  if(!S.F) return;
  if(el.id==='addCatalogo' && el.value){ const s = S.servicos.find(x => x.id===el.value); if(s) S.F.itens.push({ nome:s.nome, descricao:s.descricao||'', tipo:s.tipo, valor:+s.valor_padrao||0, qtd:0 }); el.value = ''; desenhaItens(); desenhaCondicoes(); return; }
  if(el.id==='f_foto'){ S.F.exige_foto = el.checked; return; }
  if(el.dataset.c && el.type==='checkbox'){ S.F.condicoes[el.dataset.c] = el.checked; return; }
  if(el.dataset.f==='modelo'){ const antes = el.value==='pontual' ? 'recorrente' : 'pontual';
    if(S.F.abertura===ABERTURA[antes]) S.F.abertura = ABERTURA[el.value]; if(S.F.assunto===ASSUNTO[antes]) S.F.assunto = ASSUNTO[el.value]; VIEWS.form(); return; }
  if(el.dataset.i!==undefined && el.dataset.k==='tipo'){ desenhaItens(); desenhaCondicoes(); return; }
  if(el.dataset.i!==undefined && el.dataset.k==='valor'){ const it = S.F.itens[+el.dataset.i]; if(it) el.value = it.valor ? num2(it.valor) : ''; return; }
  if(el.dataset.p!==undefined && el.dataset.k==='valor'){ const pa = S.F.condicoes.parcelas[+el.dataset.p]; if(pa) el.value = pa.valor ? num2(pa.valor) : ''; return; }
  if(el.dataset.f==='cliente_documento'){ el.value = docFmt(el.value); if(!docValido(el.value)) toast('CNPJ/CPF inválido. Confira os dígitos.', true); }
});

/* ===================== PÁGINA DO CLIENTE (só a proposta, sem login) ===================== */
const Cliente = { sb:null, token:null, dados:null,
  async boot(token){ this.token = token;
    await new Promise((ok, erro) => { const s = document.createElement('script'); s.src = SUPABASE_JS; s.onload = ok; s.onerror = () => erro(new Error('Não foi possível carregar a página. Verifique a internet e tente de novo.')); document.head.appendChild(s); });
    // sessão própria e vazia: mesmo que o navegador tenha alguém do escritório logado, aqui tudo roda como visitante
    this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'prop-cliente' } }); },
  async ver(){ const { data, error } = await this.sb.rpc('prop_publico_ver', { p_token:this.token }); if(error) throw new Error('Não foi possível abrir a proposta agora. Tente de novo em instantes.'); this.dados = data; return data; },
  async assinar(f){ const { data, error } = await this.sb.rpc('prop_publico_assinar', { p_token:this.token, p_nome:f.nome, p_cpf:f.cpf, p_email:f.email, p_cargo:f.cargo, p_hash:this.dados.hash, p_user_agent:navigator.userAgent, p_foto:f.foto || null }); if(error) throw new Error('Não foi possível registrar a assinatura agora. Tente de novo em instantes.'); return data; }
};
function telaClienteErro(msg){ $('raiz').innerHTML = `<div class="login"><div class="cx"><img src="${LOGO}" alt="Artecon artes contábeis"><div class="erros" role="alert">${esc(msg)}</div></div></div>`; }
/* reduz a foto no próprio aparelho: JPEG, lado maior até 1100 px, no máximo ~300 KB */
function reduzFoto(arquivo){
  return new Promise((ok, erro) => { const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => { try{ let q = 0.78, lado = 1100, saida = '';
        for(let i=0;i<6;i++){ const k = Math.min(1, lado/Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); saida = c.toDataURL('image/jpeg', q); if(saida.length <= 400000) break; q -= 0.1; lado -= 120; }
        URL.revokeObjectURL(url); saida.length <= 440000 && saida.startsWith('data:image/jpeg') ? ok(saida) : erro(new Error('Não foi possível reduzir a foto. Tente outra.')); }catch(e){ erro(new Error('Não foi possível ler a foto.')); } };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error('Este arquivo não é uma imagem que o navegador consiga abrir. Use JPG ou PNG.')); }; img.src = url; });
}
function avisoPrivacidade(r){
  const e = r.escritorio, contato = e.email_privacidade || e.telefone || '';
  return `<details class="privacidade"><summary>Como seus dados são tratados (LGPD)</summary>
    <p><b>Quem trata:</b> ${esc(e.nome)}${e.cnpj ? ', CNPJ ' + esc(docFmt(e.cnpj)) : ''}${e.endereco ? ', ' + esc(e.endereco) : ''}</p>
    <p><b>O que é registrado:</b> nome, CPF, e-mail e qualidade informados por você; endereço IP, navegador, data e hora; os acessos a este link${r.exige_foto ? '; e a foto sua com o documento' : ''}.</p>
    <p><b>Para quê:</b> formalizar o aceite desta proposta e comprovar quem assinou e o que foi assinado (execução de procedimentos preliminares a contrato e exercício regular de direitos${r.exige_foto ? '; a foto, para prevenir fraude na identificação do signatário' : ''}). Os dados não são usados para publicidade.</p>
    <p><b>Com quem:</b> ficam em serviços contratados pelo escritório para hospedar o sistema e enviar e-mails, que podem estar em servidores fora do Brasil. Só a direção do escritório vê o CPF completo, o IP e a foto.</p>
    <p><b>Por quanto tempo:</b> ${esc(e.prazo_guarda || 'pelo prazo da relação contratual e pelos prazos legais de prescrição')}.</p>
    <p><b>Seus direitos:</b> você pode pedir acesso, correção e informações sobre o tratamento${contato ? ' pelo contato ' + esc(contato) : ' ao escritório'}. O registro de uma proposta assinada é mantido enquanto for necessário para comprovar o aceite.</p></details>`;
}
async function telaCliente(){
  const r = await Cliente.ver(); if(!r.ok){ telaClienteErro(r.mensagem || 'Link inválido.'); return; }
  const p = r.proposta, leitura = r.tipo==='leitura', sg = r.signatario || {}; S.tenant = { nome:r.escritorio.nome, escritorio:{ ...ESCRITORIO_PADRAO, ...r.escritorio } }; S.docCliente = p;
  document.title = 'Proposta ' + numeroFmt(p) + ' | ' + r.escritorio.nome;
  let aceite;
  if(leitura) aceite = `<h2>Via assinada</h2><p>Esta proposta foi assinada por todas as partes. O comprovante das ${r.assinaturas.length} assinaturas está na última página do documento acima. Use <b>Salvar em PDF / imprimir</b> para guardar a sua via. Este endereço é só de leitura e deixa de funcionar em 30 dias.</p>${avisoPrivacidade(r)}`;
  else if(!r.pode_assinar) aceite = `<h2>Assinatura indisponível</h2><p>${r.motivo==='vencida' ? 'A validade desta proposta terminou em ' + esc(dataBR(p.validade)) + '. Peça a atualização ao escritório.' : r.motivo==='assinada' ? 'Sua assinatura já foi registrada.' : 'Esta proposta não está aberta para assinatura no momento. Fale com o escritório.'}</p>`;
  else aceite = `<h2>Assinatura eletrônica</h2><p>Leia a proposta acima. Para aceitar, identifique-se e assine. Quem assina precisa ter poderes para representar <b>${esc(p.cliente_nome)}</b>.</p>
    <div id="cliErros"></div>
    <div class="grade">
      <div class="campo"><label for="a_nome">Nome completo *</label><input type="text" id="a_nome" autocomplete="name" value="${esc(sg.nome||'')}"></div>
      <div class="campo c1"><label for="a_cpf">CPF *</label><input type="text" id="a_cpf" inputmode="numeric" placeholder="000.000.000-00"></div>
      <div class="campo c1"><label for="a_cargo">Qualidade</label><input type="text" id="a_cargo" placeholder="Sócio administrador, procurador…" value="${esc(sg.qualidade||'')}"></div>
      <div class="campo c4"><label for="a_email">E-mail * <span class="dica">(a via assinada por todos será enviada para cá)</span></label><input type="email" id="a_email" autocomplete="email" value="${esc(sg.email||'')}"></div>
    </div>
    ${r.exige_foto ? `<div class="foto-box"><b>Foto com documento *</b><p>Tire uma foto sua segurando, ao lado do rosto, um documento com foto (RG ou CNH). O rosto e o documento precisam estar nítidos.</p>
      <input type="file" id="a_foto" accept="image/*" capture="user" hidden><button type="button" class="btn" id="a_fotoBtn">Tirar ou escolher a foto</button> <span id="a_fotoInfo" class="dica"></span><div id="a_fotoPrev"></div></div>` : ''}
    <label class="marcar" style="margin-top:12px"><input type="checkbox" id="a_ok"> <span>Declaro que li e aceito integralmente os termos da Proposta de Honorários nº ${esc(numeroFmt(p))}, que tenho poderes para representar ${esc(p.cliente_nome)} neste ato e que reconheço esta assinatura eletrônica como válida e eficaz, nos termos do art. 10, § 2º, da Medida Provisória nº 2.200-2/2001. Estou ciente de que meu nome, CPF, e-mail, endereço IP, data e hora${r.exige_foto ? ' e a foto com meu documento' : ''} ficam registrados como evidência deste aceite.</span></label>
    ${avisoPrivacidade(r)}
    <div class="barra-salvar" style="margin-top:14px"><button class="btn primario" id="a_assinar">Assinar a proposta</button></div>`;
  $('raiz').innerHTML = `<div class="cliente">
    <header class="cli-topo nao-imprime"><img src="${LOGO}" alt="${esc(r.escritorio.nome)}"><div class="cli-id"><b>Proposta nº ${esc(numeroFmt(p))}${leitura ? ' — via assinada' : ''}</b><span>${esc(p.cliente_nome)}</span></div>
      <div class="acoes"><button class="btn" data-act="imprimir">Salvar em PDF / imprimir</button>${!leitura && r.pode_assinar ? '<a class="btn primario" href="#aceite" id="irAceite">Ir para a assinatura</a>' : ''}</div></header>
    <div class="doc-area" id="docArea">${docHTML(p, r.assinaturas, {})}</div>
    <section class="cli-aceite nao-imprime" id="aceite">${aceite}</section></div>`;
  const ir_ = $('irAceite'); if(ir_) ir_.onclick = ev => { ev.preventDefault(); $('aceite').scrollIntoView({ behavior:'smooth' }); };
  const cpfEl = $('a_cpf'); if(cpfEl) cpfEl.onchange = () => { cpfEl.value = docFmt(cpfEl.value); };
  let foto = null; const fi = $('a_foto');
  if(fi){ $('a_fotoBtn').onclick = () => fi.click();
    fi.onchange = async () => { const arq = fi.files && fi.files[0]; if(!arq) return; $('a_fotoInfo').textContent = 'Preparando a foto…';
      try{ foto = await reduzFoto(arq); $('a_fotoPrev').innerHTML = `<img src="${foto}" alt="Prévia da foto com o documento">`; $('a_fotoInfo').textContent = 'Foto pronta. Confira se o rosto e o documento estão legíveis; se não, tire outra.'; $('a_fotoBtn').textContent = 'Tirar outra foto'; }
      catch(e){ foto = null; $('a_fotoPrev').innerHTML = ''; $('a_fotoInfo').textContent = e.message; } fi.value = ''; }; }
  const b = $('a_assinar'); if(b) b.onclick = async () => {
    const f = { nome:$('a_nome').value.trim().replace(/\s+/g,' '), cpf:soDoc($('a_cpf').value), email:$('a_email').value.trim(), cargo:$('a_cargo').value.trim(), foto }, er = [];
    if(f.nome.length < 5 || !f.nome.includes(' ')) er.push('Informe o nome completo.');
    if(f.cpf.length !== 11 || !cpfValido(f.cpf)) er.push('CPF inválido. Confira os dígitos.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) er.push('Informe um e-mail válido.');
    if(r.exige_foto && !foto) er.push('Tire a foto com o documento.');
    if(!$('a_ok').checked) er.push('Marque a declaração para assinar.');
    const mostra = l => { $('cliErros').innerHTML = l.length ? `<div class="erros" role="alert"><ul style="margin:0;padding-left:18px">${l.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''; if(l.length) $('cliErros').scrollIntoView({ block:'center' }); };
    mostra(er); if(er.length) return;
    b.disabled = true; b.textContent = 'Registrando a assinatura…';
    try{ const x = await Cliente.assinar(f);
      if(x.ok){ const a = $('aceite'); a.innerHTML = `<h2>Assinatura registrada</h2><p>Obrigado, <b>${esc(f.nome)}</b>. Sua assinatura foi registrada em ${esc(dataHora(new Date().toISOString()))}. Código de verificação: <b>${esc(x.codigo)}</b>.</p>
          <p>${x.concluida ? 'Com a sua assinatura, a proposta ficou assinada por todos. Você receberá por e-mail, em ' + esc(f.email) + ', o endereço da via completa para impressão.' : 'Assim que as demais partes assinarem, você receberá por e-mail, em ' + esc(f.email) + ', o endereço da via completa, com todas as assinaturas, para impressão.'}</p>
          <p class="dica">Por segurança, este link foi encerrado e não abre mais.</p>`; const t = $('irAceite'); if(t) t.remove(); a.scrollIntoView({ block:'center' }); return; }
      mostra([x.mensagem || 'Não foi possível assinar.']); if(x.erro==='alterada'){ b.textContent = 'Recarregar a proposta'; b.disabled = false; b.onclick = () => telaCliente(); return; }
    }catch(e){ mostra([e.message]); }
    b.disabled = false; b.textContent = 'Assinar a proposta';
  };
}

/* em tela estreita (celular) a folha A4 encolhe para caber na largura, sem rolagem lateral; na impressão volta a 100% */
function ajustaFolha(){ const a = document.getElementById('docArea'); if(!a) return; const z = Math.min(1, (a.clientWidth - 16) / 794); document.documentElement.style.setProperty('--zf', z > 0 ? z.toFixed(3) : 1); if(z < 1) a.style.padding = '8px'; else a.style.padding = ''; }
window.addEventListener('resize', ajustaFolha);
new MutationObserver(ajustaFolha).observe(document.getElementById('raiz'), { childList:true, subtree:true });

/* ===================== INÍCIO ===================== */
function telaLogin(msg){
  $('raiz').innerHTML = `<div class="login"><div class="cx"><img src="${LOGO}" alt="Artecon artes contábeis"><div class="campo"><label for="l_email">E-mail</label><input type="email" id="l_email" autocomplete="username"></div><div class="campo"><label for="l_senha">Senha</label><input type="password" id="l_senha" autocomplete="current-password"></div>${msg ? `<div class="erros" role="alert">${esc(msg)}</div>` : ''}<button class="btn primario" style="width:100%" id="l_entrar">Entrar</button><p style="text-align:center;color:var(--suave);font-size:12px;margin:14px 0 0">Propostas de honorários · v${APP_VERSION}</p></div></div>`;
  const entrar = async () => { try{ $('l_entrar').disabled = true; await Nuvem.entrar($('l_email').value.trim(), $('l_senha').value); await abrir(); }catch(e){ telaLogin(e.message); } };
  $('l_entrar').onclick = entrar; $('l_senha').onkeydown = ev => { if(ev.key==='Enter') entrar(); };
}
async function abrir(){
  try{ await DB.carregar(); }catch(e){ if(MODO_NUVEM){ await DB.sair().catch(()=>{}); telaLogin(e.message); return; } throw e; }
  moldura(); rota();
}
(async () => {
  const mc = location.hash.match(/^#\/c\/([0-9a-f]{64})$/i);
  if(mc || /^#\/c\//.test(location.hash)){ S.modoCliente = true;
    try{ if(!mc) return telaClienteErro('Link incompleto. Copie o endereço inteiro que o escritório enviou.'); if(!MODO_NUVEM) return telaClienteErro('Este endereço só funciona na versão publicada do aplicativo.');
      await Cliente.boot(mc[1].toLowerCase()); await telaCliente(); }catch(e){ console.error(e); telaClienteErro(e.message || String(e)); }
    return; }
  if(CFG_INCOMPLETA){ $('raiz').innerHTML = `<div class="login"><div class="cx"><div class="erros" role="alert"><b>Configuração incompleta.</b><br>No <code>const CFG</code> falta ${CFG.SUPABASE_URL ? 'a chave (SUPABASE_ANON_KEY)' : 'o endereço do projeto (SUPABASE_URL)'}. Preencha os dois campos e publique de novo.</div></div></div>`; return; }
  try{ const r = await DB.boot(); if(r==='login') telaLogin(); else await abrir(); }
  catch(e){ console.error(e); $('raiz').innerHTML = `<div class="login"><div class="cx"><div class="erros" role="alert"><b>O app não abriu.</b><br>${esc(e.message || e)}</div></div></div>`; }
})();
